<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Places</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%239aabb5'/%3E%3Cpath d='M0 11h16v5H0z' fill='%235f7048'/%3E%3Cpath d='M7 11h2v5H7z' fill='%239b8a68'/%3E%3C/svg%3E"
    />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0b0e12;
      }
      canvas {
        display: block;
      }
      #hint {
        position: fixed;
        inset: 0;
        display: grid;
        place-content: center;
        gap: 0.5rem;
        color: #cfd6dd;
        font: 14px/1.6 ui-sans-serif, system-ui, sans-serif;
        text-align: center;
        background: rgba(11, 14, 18, 0.85);
        cursor: pointer;
      }
      #hint[hidden] {
        display: none;
      }
      .dim {
        opacity: 0.6;
      }
      kbd {
        background: #1b2027;
        border-radius: 3px;
        padding: 0 0.35em;
      }
    </style>
  </head>
  <body>
    <div id="hint">
      <strong>Click to look around</strong>
      <span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> move &middot; <kbd>V</kbd> walk / fly &middot; <kbd>Esc</kbd> release</span>
      <span class="dim">Flying adds <kbd>Q</kbd>/<kbd>E</kbd> for down/up and <kbd>Shift</kbd> to speed up.</span>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
