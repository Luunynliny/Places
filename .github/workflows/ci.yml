name: CI

on:
  pull_request:
    branches: [develop, main]
    # `edited` so a retitled PR is re-checked; without it a bad title stays red forever.
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run typecheck
      - run: npm run build

  pr-title:
    # Feature PRs are squash-merged, so the PR title becomes the commit message that
    # semantic-release reads. The local commit-msg hook can't guard that.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
